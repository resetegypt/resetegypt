/* ---------- figure (localised, mirrored in RTL) ---------- */
var FIG = {
  hunger:{fr:"Faim",ar:"الجوع",en:"Hunger"},
  thirst:{fr:"Soif",ar:"العطش",en:"Thirst"},
  cig:{fr:"Cigarette",ar:"السجارة",en:"Cigarette"},
  real:{fr:"vrai capteur",ar:"حسّاس حقيقي",en:"real sensor"},
  extra:{fr:"capteur en trop",ar:"حسّاس زيادة",en:"extra sensor"},
  brain:{fr:"Le cerveau",ar:"المخ",en:"The brain"},
  signal:{fr:"reçoit le signal",ar:"بيستقبل الإشارة",en:"receives the signal"},
  laser:{fr:"LASER",ar:"ليزر",en:"LASER"},
  cap:{fr:"Fréquence électrique très basse = capteur en trop",ar:"تردد كهربائي واطي جدًا = حسّاس زيادة",en:"Very low electrical frequency = extra sensor"}
};

function figure(L){
  var rtl = L === "ar", W = 700;
  function fx(x){ return rtl ? W - x : x; }
  function rx(x,w){ return rtl ? W - (x + w) : x; }
  var disp = rtl ? "Noto Kufi Arabic, sans-serif" : "Familjen Grotesk, sans-serif";
  var mono = rtl ? "Noto Kufi Arabic, sans-serif" : "IBM Plex Mono, monospace";
  function pill(y,name,sub,ember){
    return '<rect x="'+rx(16,180)+'" y="'+y+'" width="180" height="50" rx="3" fill="'+(ember?"var(--ember-soft)":"none")+'" stroke="'+(ember?"var(--ember)":"var(--accent)")+'" stroke-width="1"></rect>'+
      '<text x="'+fx(106)+'" y="'+(y+22)+'" text-anchor="middle" font-family="'+disp+'" font-size="14" font-weight="600" fill="var(--ink)">'+name+'</text>'+
      '<text x="'+fx(106)+'" y="'+(y+39)+'" text-anchor="middle" font-family="'+mono+'" font-size="9.5" fill="'+(ember?"var(--ember)":"var(--muted)")+'">'+sub+'</text>';
  }
  return '<div class="figure" dir="ltr">'+
    '<svg viewBox="0 0 700 215" role="img" aria-label="'+FIG.cap[L]+'">'+
      '<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker></defs>'+
      '<rect x="'+rx(506,178)+'" y="10" width="178" height="186" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"></rect>'+
      '<text x="'+fx(595)+'" y="98" text-anchor="middle" font-family="'+disp+'" font-size="16" font-weight="600" fill="var(--ink)">'+FIG.brain[L]+'</text>'+
      '<text x="'+fx(595)+'" y="119" text-anchor="middle" font-family="'+mono+'" font-size="10" fill="var(--muted)">'+FIG.signal[L]+'</text>'+
      '<g fill="none" stroke="currentColor" stroke-width="1.4" color="var(--accent)">'+
        '<line x1="'+fx(204)+'" y1="35" x2="'+fx(494)+'" y2="35" marker-end="url(#arw)"></line>'+
        '<line x1="'+fx(204)+'" y1="103" x2="'+fx(494)+'" y2="103" marker-end="url(#arw)"></line>'+
      '</g>'+
      '<line x1="'+fx(204)+'" y1="171" x2="'+fx(352)+'" y2="171" fill="none" stroke="var(--ember)" stroke-width="1.4" stroke-dasharray="5 4"></line>'+
      '<g stroke="var(--ember)" stroke-width="2" stroke-linecap="round">'+
        '<line x1="'+fx(364)+'" y1="163" x2="'+fx(380)+'" y2="179"></line>'+
        '<line x1="'+fx(380)+'" y1="163" x2="'+fx(364)+'" y2="179"></line>'+
      '</g>'+
      '<text x="'+fx(372)+'" y="199" text-anchor="middle" font-family="'+mono+'" font-size="9.5" fill="var(--ember)">'+FIG.laser[L]+'</text>'+
      pill(10, FIG.hunger[L], FIG.real[L], false)+
      pill(78, FIG.thirst[L], FIG.real[L], false)+
      pill(146, FIG.cig[L], FIG.extra[L], true)+
    '</svg>'+
    '<div class="cap">'+FIG.cap[L]+'</div>'+
  '</div>';
}

/* ---------- rendering ---------- */
function block(b, L){
  var st = b.style ? ' style="'+b.style+'"' : '';
  switch(b.t){
    case "eyebrow": return '<div class="eyebrow">'+b.v[L]+'</div>';
    case "h2": return '<h2>'+b.v[L]+'</h2>';
    case "lede": return '<p class="lede">'+b.v[L]+'</p>';
    case "p":
      if (b.cls === "muted") { return '<p style="color:var(--muted)"'+(b.style?'':'')+'>'+b.v[L]+'</p>'; }
      if (b.cls === "tagline") { return '<p><strong class="tag">'+b.v[L]+'</strong></p>'; }
      return '<p'+st+'>'+b.v[L]+'</p>';
    case "note":
      return '<div class="note"'+st+'><span class="who">'+b.who[L]+'</span>'+b.v[L]+'</div>';
    case "script":
      return '<div class="script"'+st+'><span class="who">'+b.who[L]+'</span><q>'+b.q[L]+'</q></div>';
    case "cols2":
      return '<div class="cols two"><div class="stack">'+b.left.map(function(x){return block(x,L);}).join("")+
             '</div><div class="stack">'+b.right.map(function(x){return block(x,L);}).join("")+'</div></div>';
    case "cols3":
      return '<div class="cols">'+b.items.map(function(it){
        return '<div><h3>'+it.h[L]+'</h3><p class="sub">'+it.p[L]+'</p></div>';
      }).join("")+'</div>';
    case "steps":
      return '<ol class="steps">'+b.items.map(function(it){
        return '<li><div><h3>'+it.h[L]+'</h3><p>'+it.p[L]+'</p></div></li>';
      }).join("")+'</ol>';
    case "senses":
      return '<dl class="senses">'+b.items.map(function(it){
        return '<div class="sense"><dt>'+it.dt[L]+'</dt><dd>'+it.dd[L]+'</dd></div>';
      }).join("")+'</dl>';
    case "compare":
      return '<div class="compare"><div class="yes"><h3>'+b.yes.h[L]+'</h3><ul>'+
        b.yes.items.map(function(x){return '<li>'+x[L]+'</li>';}).join("")+'</ul></div>'+
        '<div class="no"><h3>'+b.no.h[L]+'</h3><ul>'+
        b.no.items.map(function(x){return '<li>'+x[L]+'</li>';}).join("")+'</ul></div></div>';
    case "timeline":
      return '<div class="tl">'+b.items.map(function(it){
        return '<div><span>'+it.k[L]+'</span><p>'+it.p[L]+'</p></div>';
      }).join("")+'</div>';
    case "recap":
      return '<ul class="recap">'+b.items.map(function(x){return '<li>'+x[L]+'</li>';}).join("")+'</ul>';
    case "next":
      return '<div class="next"><span class="k">'+b.k[L]+'</span><span class="v">'+b.v[L]+'</span></div>';
    case "figure":
      return '<div style="margin-top:22px">'+figure(L)+'</div>';
    default: return "";
  }
}

function render(s, L){
  if (s.title){
    var m = s.title.meta.map(function(x){ return '<span>'+x.k[L]+' · <b>'+x.v[L]+'</b></span>'; }).join("");
    return '<div class="title-slide"><div><div class="eyebrow">'+s.title.eyebrow[L]+'</div><h1>'+s.title.h1[L]+'</h1></div>'+
           '<p class="lede" style="margin:0">'+s.title.lede[L]+'</p><div class="title-meta">'+m+'</div></div>';
  }
  if (s.section){
    return '<div class="title-slide"><div><div class="eyebrow">'+s.section.eyebrow[L]+'</div><h1>'+s.section.h1[L]+'</h1></div>'+
           '<p class="lede" style="margin:0">'+s.section.lede[L]+'</p></div>';
  }
  return s.blocks.map(function(b){ return block(b, L); }).join("");
}

/* ---------- chapters ---------- */
var CH = [];
for (var k=0;k<S.length;k++){ if (S[k].section){ CH.push({start:k, end:k}); } else if (CH.length){ CH[CH.length-1].end = k; } }
for (var k2=0;k2<CH.length;k2++){ CH[k2].len = CH[k2].end - CH[k2].start + 1; CH[k2].meta = CH_META[k2]; }

/* ---------- progress (per viewer, best effort) ---------- */
var PKEY = "reset-discours-progress-v1";
function loadP(){ try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch(e){ return {}; } }
function saveP(p){ try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch(e){} }
var P = loadP();
function markSeen(c, idx){
  var r = P["c"+c] || {seen:0, done:false};
  if (idx+1 > r.seen){ r.seen = idx+1; }
  if (idx === CH[c].len-1){ r.done = true; }
  P["c"+c] = r; saveP(P);
}

/* ---------- home ---------- */
function renderHome(L){
  var m = HOME.meta.map(function(x){ return '<span>'+x.k[L]+' · <b>'+x.v[L]+'</b></span>'; }).join("");
  var cards = CH.map(function(c, n){
    var r = P["c"+n] || {seen:0, done:false};
    var pct = Math.round(Math.min(r.seen, c.len) / c.len * 100);
    var cta = r.done ? UI.doneL[L] : (r.seen > 0 ? UI.resume[L] : UI.start[L]);
    var topics = c.meta.topics.map(function(t){ return '<li><span>'+t[L]+'</span></li>'; }).join("");
    return '<button type="button" class="module" data-ch="'+n+'">'+
      '<span class="num">'+UI.chap[L]+' '+(n+1)+'</span>'+
      '<h3>'+c.meta.title[L]+'</h3>'+
      '<p class="blurb">'+c.meta.blurb[L]+'</p>'+
      '<ul>'+topics+'</ul>'+
      '<span class="foot">'+
        '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="meta"><span>'+c.len+' '+UI.seq[L]+(r.seen>0 && !r.done ? ' · '+Math.min(r.seen,c.len)+'/'+c.len : '')+'</span>'+
        '<span class="cta'+(r.done?' done':'')+'">'+cta+' →</span></span>'+
      '</span>'+
    '</button>';
  }).join("");
  var any = CH.some(function(c,n){ var r=P["c"+n]; return r && r.seen>0; });
  return '<div class="home"><div class="title-slide" style="gap:26px">'+
    '<div><div class="eyebrow">'+HOME.eyebrow[L]+'</div><h1>'+HOME.h1[L]+'</h1></div>'+
    '<p class="lede" style="margin:0">'+HOME.lede[L]+'</p></div>'+
    '<div class="modules">'+cards+'</div>'+
    '<div class="title-meta">'+m+(any ? '<button type="button" class="restart" id="reset">'+UI.restart[L]+'</button>' : '')+'</div>'+
  '</div>';
}

/* ---------- controller ---------- */
var app=document.getElementById("app"), slide=document.getElementById("slide"),
    rail=document.getElementById("rail"), count=document.getElementById("count"),
    chap=document.getElementById("chapterLabel"), brand=document.getElementById("brand"),
    prev=document.getElementById("prev"), next=document.getElementById("next"),
    homeBtn=document.getElementById("home"), chips=document.getElementById("chips"),
    hint=document.getElementById("hint"), L="fr", view="home", c=0, i=0;

function pad(n){ return n<10 ? "0"+n : ""+n; }

function drawChrome(){
  app.setAttribute("data-lang", L);
  app.setAttribute("dir", L==="ar" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", L==="ar" ? "ar-EG" : L);
  brand.innerHTML = UI.brand[L];
  homeBtn.textContent = UI.home[L];
  prev.textContent = UI.prev[L];
  chips.innerHTML = CH.map(function(x, n){
    return '<button type="button" data-ch="'+n+'" aria-current="'+(view==="slide" && n===c)+'">'+UI.chap[L].charAt(0)+(n+1)+'</button>';
  }).join("");
}

function draw(){
  drawChrome();
  if (view === "home"){
    slide.innerHTML = renderHome(L);
    chap.textContent = "";
    hint.textContent = UI.hintHome[L];
    count.textContent = "";
    rail.style.width = "0%";
    homeBtn.hidden = true; prev.hidden = true; next.hidden = true;
  } else {
    var ch = CH[c], s = S[ch.start + i];
    slide.innerHTML = render(s, L);
    chap.textContent = s.ch[L];
    hint.textContent = UI.hint[L];
    count.textContent = pad(i+1)+" / "+pad(ch.len);
    rail.style.width = ((i+1)/ch.len*100)+"%";
    homeBtn.hidden = false; prev.hidden = false; next.hidden = false;
    prev.disabled = (i===0 && c===0);
    next.textContent = (i < ch.len-1) ? UI.next[L] : (c < CH.length-1 ? UI.nextCh[L] : UI.finish[L]);
    markSeen(c, i);
  }
  window.scrollTo(0,0);
}

function openCh(n, at){ view="slide"; c=n; i=at||0; draw(); }
function goHome(){ view="home"; draw(); }
function fwd(){
  if (view==="home"){ return; }
  if (i < CH[c].len-1){ i++; draw(); }
  else if (c < CH.length-1){ openCh(c+1, 0); }
  else { goHome(); }
}
function back(){
  if (view==="home"){ return; }
  if (i > 0){ i--; draw(); }
  else if (c > 0){ openCh(c-1, CH[c-1].len-1); }
}

slide.addEventListener("click", function(e){
  var mod = e.target.closest ? e.target.closest(".module") : null;
  if (mod){ var n = +mod.getAttribute("data-ch"); var r = P["c"+n]; openCh(n, (r && !r.done && r.seen>0) ? Math.min(r.seen-1, CH[n].len-1) : 0); return; }
  if (e.target.id === "reset"){ P = {}; saveP(P); draw(); }
});
chips.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("button[data-ch]") : null;
  if (b){ openCh(+b.getAttribute("data-ch"), 0); }
});
homeBtn.addEventListener("click", goHome);
prev.addEventListener("click", back);
next.addEventListener("click", fwd);

Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function(b){
  b.addEventListener("click", function(){
    L = b.getAttribute("data-lang");
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function(o){
      o.setAttribute("aria-pressed", o===b ? "true" : "false");
    });
    draw();
  });
});
document.addEventListener("keydown", function(e){
  var f = L==="ar" ? "ArrowLeft" : "ArrowRight";
  var bk = L==="ar" ? "ArrowRight" : "ArrowLeft";
  if (e.key===f || e.key==="PageDown"){ fwd(); }
  else if (e.key===bk || e.key==="PageUp"){ back(); }
  else if (e.key==="Escape" || e.key==="Home"){ goHome(); }
  else if (e.key==="End" && view==="slide"){ i = CH[c].len-1; draw(); }
  else { return; }
  e.preventDefault();
});
var x0=null;
document.addEventListener("touchstart", function(e){ x0=e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener("touchend", function(e){
  if (x0===null){ return; }
  var dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 55){
    var forward = L==="ar" ? dx > 0 : dx < 0;
    if (forward){ fwd(); } else { back(); }
  }
  x0=null;
}, {passive:true});

draw();
})();
</script>
