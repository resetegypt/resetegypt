name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Service Postgres pour les tests d'intégration Prisma. Éphémère, healthcheck
    # au démarrage : les steps ne tournent pas tant que la DB n'est pas prête.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reset
          POSTGRES_PASSWORD: reset
          POSTGRES_DB: reset_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reset -d reset_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://reset:reset@localhost:5432/reset_ci
      DIRECT_URL: postgresql://reset:reset@localhost:5432/reset_ci
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-32chars
      ENCRYPTION_KEY: ci-test-encryption-key-32-chars-min-len-required
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Prisma generate
        run: pnpm --filter @reset/api exec prisma generate

      - name: Prisma migrate (apply schema to CI DB)
        run: pnpm --filter @reset/api exec prisma migrate deploy

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Format check
        run: pnpm format:check
